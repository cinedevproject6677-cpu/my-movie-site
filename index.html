  <script>
    const API_KEY = "fd425ec0c76fd15b63572c439ee65db7"; 
    const BASE_URL = "https://api.themoviedb.org/3";
    const IMG_URL = "https://image.tmdb.org/t/p/original";

    // Intro Animation Loader
    setTimeout(() => {
        document.getElementById('intro').style.display = 'none';
        initApp();
    }, 3500);

    async function initApp() {
        try {
            // Hero Banner Fetch
            const resHero = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}`);
            const dataHero = await resHero.json();
            const movie = dataHero.results[Math.floor(Math.random() * 10)];
            
            document.getElementById('hero').style.backgroundImage = `url(${IMG_URL}${movie.backdrop_path})`;
            document.getElementById('hero-title').innerText = movie.title;

            // Rows Fetch
            fetchRow("trending-row", `${BASE_URL}/trending/movie/week?api_key=${API_KEY}`);
            fetchRow("top-rated-row", `${BASE_URL}/movie/top_rated?api_key=${API_KEY}`);
            fetchRow("action-row", `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=28`);
            
            // Top 10 Ranking
            fetchRanking();

        } catch (error) {
            console.error("Data load nahi ho raha:", error);
        }
    }

    async function fetchRow(elementId, url) {
        const res = await fetch(url);
        const data = await res.json();
        const container = document.getElementById(elementId);
        container.innerHTML = data.results.map(m => `
            <div class="movie-card" onclick="openTrailer(${m.id})">
                <img class="poster" src="${IMG_URL}${m.poster_path}" alt="${m.title}">
            </div>
        `).join('');
    }

    async function fetchRanking() {
        const res = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}`);
        const data = await res.json();
        const container = document.getElementById('ranking-row');
        container.innerHTML = data.results.slice(0, 10).map((m, i) => `
            <div class="rank-card" onclick="openTrailer(${m.id})">
                <div class="rank-num">${i + 1}</div>
                <img class="poster" style="width:130px" src="${IMG_URL}${m.poster_path}">
            </div>
        `).join('');
    }

    async function openTrailer(id) {
        const res = await fetch(`${BASE_URL}/movie/${id}/videos?api_key=${API_KEY}`);
        const data = await res.json();
        const trailer = data.results.find(v => v.type === 'Trailer');
        if(trailer) {
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('player').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
        } else {
            alert("Trailer nahi mila!");
        }
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('player').src = "";
    }

    // Navbar scroll effect
    window.addEventListener('scroll', () => {
        if (window.scrollY > 100) document.getElementById('nav').classList.add('black');
        else document.getElementById('nav').classList.remove('black');
    });
                </script>
