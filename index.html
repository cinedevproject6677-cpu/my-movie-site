<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieTown | Netflix Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --n-red: #E50914; --black: #000; --grey: #141414; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--black); color: white; font-family: 'Roboto', sans-serif; overflow-x: hidden; }

        /* --- 1. M-LOGO INTRO ANIMATION --- */
        #intro { position: fixed; inset: 0; background: black; z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .m-logo { color: var(--n-red); font-family: 'Bebas Neue', cursive; font-size: 150px; font-weight: 900; animation: zoomIntro 3.5s ease-in-out forwards; text-shadow: 0 0 20px rgba(229, 9, 20, 0.5); }
        @keyframes zoomIntro { 0% { transform: scale(0.5); opacity: 0; filter: blur(10px); } 40% { transform: scale(1); opacity: 1; filter: blur(0); } 100% { transform: scale(15); opacity: 0; visibility: hidden; } }

        /* --- 2. NAVBAR --- */
        .nav { position: fixed; top: 0; width: 100%; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 4%; z-index: 2000; transition: 0.5s; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .nav.black { background: #000; }
        .logo { color: var(--n-red); font-family: 'Bebas Neue'; font-size: 35px; letter-spacing: 1px; text-decoration: none; }
        .search-box { display: flex; align-items: center; background: rgba(0,0,0,0.7); border: 1px solid #fff; padding: 5px 12px; border-radius: 2px; }
        #search-input { background: transparent; border: none; color: white; outline: none; width: 150px; font-size: 14px; }

        /* --- 3. HERO BANNER --- */
        .hero { height: 85vh; background-size: cover; background-position: center top; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 4% 100px; }
        .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #000 5%, transparent 70%); }
        .hero-title { font-size: 4.5rem; font-family: 'Bebas Neue'; z-index: 10; margin-bottom: 15px; }

        /* --- 4. ROWS & RANKING --- */
        .row { margin: 30px 0 30px 4%; }
        .row-header { font-size: 22px; font-weight: 700; margin-bottom: 15px; }
        .scroller { display: flex; overflow-x: auto; gap: 12px; padding: 20px 0; }
        .scroller::-webkit-scrollbar { display: none; }
        .rank-card { display: flex; align-items: center; min-width: 260px; cursor: pointer; transition: 0.3s; }
        .rank-card:hover { transform: scale(1.05); }
        .rank-num { font-size: 150px; font-weight: 900; color: #000; -webkit-text-stroke: 4px #555; line-height: 1; margin-right: -25px; font-family: 'Bebas Neue'; }
        .movie-card { position: relative; min-width: 150px; transition: 0.4s; cursor: pointer; }
        .movie-card:hover { transform: scale(1.1); z-index: 100; }
        .poster { width: 100%; border-radius: 4px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* --- 5. MODAL --- */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; justify-content: center; align-items: center; }
        .modal-content { width: 95%; max-width: 900px; height: 70vh; position: relative; }
        .close { position: absolute; top: -50px; right: 0; font-size: 40px; color: white; cursor: pointer; }

        #search-view { display: none; padding-top: 100px; min-height: 100vh; padding-left: 4%; padding-right: 4%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
    </style>
</head>
<body>

    <div id="intro"><div class="m-logo">M</div></div>

    <nav id="nav" class="nav">
        <a href="#" class="logo" onclick="location.reload()">MOVIETOWN</a>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search..." onkeyup="handleSearch(event)">
        </div>
    </nav>

    <div id="main-ui">
        <div id="hero" class="hero"><h1 id="hero-title" class="hero-title">Loading...</h1></div>
        
        <div class="row">
            <div class="row-header">Top 10 Today</div>
            <div id="ranking-row" class="scroller"></div>
        </div>

        <div class="row">
            <div class="row-header">Trending Now</div>
            <div id="trending-row" class="scroller"></div>
        </div>

        <div class="row">
            <div class="row-header">Action Movies</div>
            <div id="action-row" class="scroller"></div>
        </div>
    </div>

    <div id="search-view">
        <h2 style="margin-bottom: 20px;">Search Results</h2>
        <div id="search-results" class="grid"></div>
    </div>

    <div id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <iframe id="player" width="100%" height="100%" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        const API_KEY = "fd425ec0c76fd15b63572c439ee65db7";
        const BASE_URL = "https://api.themoviedb.org/3";
        const IMG_URL = "https://image.tmdb.org/t/p/original";

        // Start App after intro
        setTimeout(() => {
            document.getElementById('intro').style.display = 'none';
            initApp();
        }, 3500);

        async function initApp() {
            try {
                const res = await fetch(`${BASE_URL}/movie/popular?api_key=${API_KEY}`);
                const data = await res.json();
                const movie = data.results[Math.floor(Math.random() * 5)];
                
                document.getElementById('hero').style.backgroundImage = `url(${IMG_URL}${movie.backdrop_path})`;
                document.getElementById('hero-title').innerText = movie.title;

                fetchRanking();
                fetchRow("trending-row", `${BASE_URL}/trending/movie/week?api_key=${API_KEY}`);
                fetchRow("action-row", `${BASE_URL}/discover/movie?api_key=${API_KEY}&with_genres=28`);
            } catch (err) { console.error(err); }
        }

        async function fetchRow(id, url) {
            const res = await fetch(url);
            const data = await res.json();
            document.getElementById(id).innerHTML = data.results.map(m => `
                <div class="movie-card" onclick="openTrailer(${m.id})">
                    <img class="poster" src="${IMG_URL}${m.poster_path}">
                </div>
            `).join('');
        }

        async function fetchRanking() {
            const res = await fetch(`${BASE_URL}/movie/top_rated?api_key=${API_KEY}`);
            const data = await res.json();
            document.getElementById('ranking-row').innerHTML = data.results.slice(0, 10).map((m, i) => `
                <div class="rank-card" onclick="openTrailer(${m.id})">
                    <div class="rank-num">${i + 1}</div>
                    <img class="poster" style="width:130px" src="${IMG_URL}${m.poster_path}">
                </div>
            `).join('');
        }

        async function handleSearch(e) {
            const query = e.target.value;
            if (query.length > 2) {
                document.getElementById('main-ui').style.display = 'none';
                document.getElementById('search-view').style.display = 'block';
                const res = await fetch(`${BASE_URL}/search/movie?api_key=${API_KEY}&query=${query}`);
                const data = await res.json();
                document.getElementById('search-results').innerHTML = data.results.map(m => `
                    <div class="movie-card" onclick="openTrailer(${m.id})">
                        <img class="poster" src="${m.poster_path ? IMG_URL + m.poster_path : 'https://via.placeholder.com/150x225?text=No+Poster'}">
                    </div>
                `).join('');
            } else if (query.length === 0) {
                document.getElementById('main-ui').style.display = 'block';
                document.getElementById('search-view').style.display = 'none';
            }
        }

        async function openTrailer(id) {
            const res = await fetch(`${BASE_URL}/movie/${id}/videos?api_key=${API_KEY}`);
            const data = await res.json();
            const trailer = data.results.find(v => v.type === 'Trailer');
            if(trailer) {
                document.getElementById('modal').style.display = 'flex';
                document.getElementById('player').src = `https://www.youtube.com/embed/${trailer.key}?autoplay=1`;
            } else { alert("Trailer available nahi hai."); }
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('player').src = "";
        }

        window.onscroll = () => {
            if (window.scrollY > 50) document.getElementById('nav').classList.add('black');
            else document.getElementById('nav').classList.remove('black');
        };
    </script>
</body>
</html>
