    <title>MovieTown | Netflix Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --n-red: #E50914; --black: #000; --grey: #141414; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--black); color: white; font-family: 'Roboto', sans-serif; overflow-x: hidden; }

        /* --- 1. M-LOGO INTRO ANIMATION --- */
        #intro {
            position: fixed; inset: 0; background: black; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
        }
        .m-logo {
            color: var(--n-red); font-family: 'Bebas Neue', cursive;
            font-size: 150px; font-weight: 900;
            animation: zoomIntro 3.5s ease-in-out forwards;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        }
        @keyframes zoomIntro {
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); }
            40% { transform: scale(1); opacity: 1; filter: blur(0); }
            100% { transform: scale(15); opacity: 0; visibility: hidden; }
        }

        /* --- 2. NAVBAR --- */
        .nav {
            position: fixed; top: 0; width: 100%; height: 70px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 4%; z-index: 2000; transition: 0.5s;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .nav.black { background: #000; }
        .logo { color: var(--n-red); font-family: 'Bebas Neue'; font-size: 35px; letter-spacing: 1px; }
        .search-box {
            display: flex; align-items: center; background: rgba(0,0,0,0.7);
            border: 1px solid #fff; padding: 5px 12px; border-radius: 2px;
        }
        #search-input { background: transparent; border: none; color: white; outline: none; width: 150px; font-size: 14px; }

        /* --- 3. HERO BANNER --- */
        .hero {
            height: 85vh; background-size: cover; background-position: center top;
            position: relative; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 0 4% 100px;
        }
        .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #000 5%, transparent 70%); }
        .hero-title { font-size: 4.5rem; font-family: 'Bebas Neue'; z-index: 10; margin-bottom: 15px; }
        .btns { display: flex; gap: 15px; z-index: 10; }
        .btn { padding: 12px 30px; border-radius: 4px; font-weight: 700; border: none; cursor: pointer; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .btn-white { background: white; color: black; }
        .btn-gray { background: rgba(109, 109, 110, 0.7); color: white; }

        /* --- 4. ROWS & RANKING --- */
        .row { margin: 30px 0 30px 4%; }
        .row-header { font-size: 22px; font-weight: 700; margin-bottom: 15px; }
        .scroller { display: flex; overflow-x: auto; gap: 12px; padding: 20px 0; }
        .scroller::-webkit-scrollbar { display: none; }

        .rank-card { display: flex; align-items: center; min-width: 260px; cursor: pointer; transition: 0.3s; }
        .rank-card:hover { transform: scale(1.05); }
        .rank-num {
            font-size: 150px; font-weight: 900; color: #000;
            -webkit-text-stroke: 4px #555; line-height: 1; margin-right: -25px;
        }
        .movie-card { position: relative; min-width: 150px; transition: 0.4s; cursor: pointer; }
        .movie-card:hover { transform: scale(1.1); z-index: 100; }
        .poster { width: 100%; border-radius: 4px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .tag { position: absolute; bottom: 0; width: 100%; background: var(--n-red); color: white; font-size: 10px; text-align: center; font-weight: 900; padding: 4px 0; border-radius: 0 0 4px 4px; }

        /* --- 5. MODAL & FOOTER --- */
        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 5000; justify-content: center; align-items: center; }
        .modal-content { width: 95%; max-width: 900px; position: relative; }
        .close { position: absolute; top: -50px; right: 0; font-size: 40px; color: white; cursor: pointer; }

        footer { padding: 60px 4%; text-align: center; border-top: 1px solid #333; margin-top: 50px; }
        .tmdb-logo { width: 100px; margin: 20px auto; display: block; filter: grayscale(1); opacity: 0.6; }
        .footer-text { font-size: 12px; color: #808080; }

        #search-view { display: none; padding-top: 100px; min-height: 100vh; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; padding: 0 4%; }
    </style>
</head>
